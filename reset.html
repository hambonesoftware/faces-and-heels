<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Faces & Heels — Refreshing Build</title>
  <style>
    html,body{height:100%;margin:0;background:#050A12;color:#F5F8FC;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.card{width:min(92vw,520px);padding:28px;border-radius:22px;background:#0C1725;border:1px solid #263A52;text-align:center;box-shadow:0 22px 70px #0008}.brand{font-weight:950;font-size:28px;letter-spacing:.02em}.brand b{color:#2DBBFF}.brand em{color:#FF405F;font-style:normal}.spinner{width:34px;height:34px;margin:22px auto;border:4px solid #263A52;border-top-color:#FFC72C;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#A3B4C8;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><b>FACES</b> &amp; <em>HEELS</em></div>
    <div class="spinner"></div>
    <p>Clearing the older Playtest cache and loading v1.6.0…</p>
  </div>
  <script>
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(reg => reg.scope === new URL('./', location.href).href).map(reg => reg.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(key => key.startsWith('faces-heels-')).map(key => caches.delete(key)));
      }
    } catch (e) { console.warn(e); }
    const target = new URLSearchParams(location.search).get('next') === 'motion-lab.html' ? './motion-lab.html' : './';
    location.replace(target + '?fhbuild=1.6.0&t=' + Date.now());
  })();
  </script>
</body>
</html>
